<!doctype html>
<html lang="ko" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 집 집안일 · 피클 하우스</title>
<meta name="description" content="종화와 수뚜의 집안일 체크리스트. 방마다 오늘 할 일을 체크하고 담당을 바꿔요.">
<meta name="theme-color" content="#FBF5E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191614" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23FBF5E9'/%3E%3Cg fill='none' stroke='%235B8DEF' stroke-width='11' stroke-linecap='round'%3E%3Cpath d='M32 24v52M68 24v52M32 50h36M32 76h36'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-title" content="피클 하우스">
<meta property="og:type" content="website">
<meta property="og:title" content="우리 집 집안일 · 피클 하우스">
<meta property="og:description" content="종화와 수뚜의 집안일 체크리스트. 방마다 오늘 할 일을 체크하고 담당을 바꿔요.">
<meta property="og:locale" content="ko_KR">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip" href="#house">집 안으로 바로 가기</a>

<div class="backdrop" aria-hidden="true">
  <span class="sky-glow"></span>
  <span class="orb"></span>
  <span class="stars"></span>
</div>

<header class="top">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 100 100" focusable="false">
        <g fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round">
          <path d="M32 26v50M68 26v50M32 51h36M32 76h36"/>
        </g>
        <circle cx="43" cy="38" r="4.2" fill="#2B2B2B"/>
        <circle cx="57" cy="38" r="4.2" fill="#2B2B2B"/>
      </svg>
    </span>
    <div>
      <p class="brand-kicker">PICKLE HOUSE</p>
      <h1 class="brand-title">우리 집 집안일, 피클 하우스</h1>
    </div>
  </div>

  <div class="top-side">
    <p class="date-line" id="dateLine">오늘</p>
    <button class="lamp" id="lampBtn" type="button" aria-pressed="false" aria-label="집 안 불 켜고 끄기">
      <span class="lamp-icon" id="lampIcon" aria-hidden="true">🌙</span>
      <span class="lamp-label" id="lampLabel">밤 켜기</span>
    </button>
  </div>
</header>

<main>
  <section class="summary" aria-labelledby="sumLabel">
    <div class="summary-figure-wrap">
      <p class="summary-label" id="sumLabel">오늘의 집안일</p>
      <p class="summary-figure"><span id="sumPct">0</span><small>%</small></p>
      <p class="summary-sub" id="sumSub">0 / 0 완료</p>
    </div>

    <div class="summary-mid">
      <div class="summary-bar" role="img" aria-hidden="true"><span id="sumBar"></span></div>
      <ul class="who-counts" id="whoCounts"></ul>
    </div>

    <div class="filters" role="group" aria-label="담당자 필터">
      <button class="pill" type="button" data-filter="all" aria-pressed="true">전체</button>
      <button class="pill" type="button" data-filter="jh" aria-pressed="false">종화</button>
      <button class="pill" type="button" data-filter="su" aria-pressed="false">수뚜</button>
      <button class="pill" type="button" data-filter="both" aria-pressed="false">같이</button>
    </div>
  </section>

  <div class="cols">
    <section class="house" id="house" aria-label="우리 집 평면도">
      <div class="roof" aria-hidden="true">
        <span class="chimney"></span>
        <span class="smoke"></span>
      </div>

      <div class="floors" id="floors">
        <article class="room room--living" data-room="living">
          <button class="room-btn" type="button" aria-haspopup="dialog" aria-label="거실 집안일 보기">
            <span class="room-head">
              <span class="room-icon" aria-hidden="true">🛋️</span>
              <span class="room-name">거실</span>
              <span class="room-badge" data-count="living">4</span>
            </span>
            <span class="room-sub" data-sub="living">0 / 4 완료</span>
            <span class="room-bar" aria-hidden="true"><span data-bar="living"></span></span>
            <span class="room-preview" data-preview="living"></span>
          </button>
          <span class="rug" aria-hidden="true"></span>
          <svg class="sofa" viewBox="0 0 220 96" aria-hidden="true" focusable="false">
            <rect class="s1" x="26" y="30" width="168" height="36" rx="13"/>
            <rect class="s2" x="26" y="12" width="168" height="34" rx="15"/>
            <rect class="s3" x="10" y="38" width="24" height="34" rx="11"/>
            <rect class="s3" x="186" y="38" width="24" height="34" rx="11"/>
            <path class="s4" d="M110 16v46"/>
            <rect class="s5" x="42" y="68" width="10" height="9" rx="4"/>
            <rect class="s5" x="168" y="68" width="10" height="9" rx="4"/>
          </svg>
          <span class="slot slot--su" data-slot="living-su"></span>
          <span class="slot slot--jh" data-slot="living-jh"></span>
        </article>

        <article class="room room--kitchen" data-room="kitchen">
          <button class="room-btn" type="button" aria-haspopup="dialog" aria-label="주방 집안일 보기">
            <span class="room-head">
              <span class="room-icon" aria-hidden="true">🍳</span>
              <span class="room-name">주방</span>
              <span class="room-badge" data-count="kitchen">4</span>
            </span>
            <span class="room-sub" data-sub="kitchen">0 / 4 완료</span>
            <span class="room-bar" aria-hidden="true"><span data-bar="kitchen"></span></span>
            <span class="room-preview" data-preview="kitchen"></span>
          </button>
          <span class="slot slot--su" data-slot="kitchen-su"></span>
          <span class="slot slot--jh" data-slot="kitchen-jh"></span>
        </article>

        <article class="room room--bath" data-room="bath">
          <button class="room-btn" type="button" aria-haspopup="dialog" aria-label="욕실 집안일 보기">
            <span class="room-head">
              <span class="room-icon" aria-hidden="true">🛁</span>
              <span class="room-name">욕실</span>
              <span class="room-badge" data-count="bath">4</span>
            </span>
            <span class="room-sub" data-sub="bath">0 / 4 완료</span>
            <span class="room-bar" aria-hidden="true"><span data-bar="bath"></span></span>
            <span class="room-preview" data-preview="bath"></span>
          </button>
          <span class="slot slot--su" data-slot="bath-su"></span>
          <span class="slot slot--jh" data-slot="bath-jh"></span>
        </article>

        <article class="room room--bedroom" data-room="bedroom">
          <button class="room-btn" type="button" aria-haspopup="dialog" aria-label="안방과 아이방 집안일 보기">
            <span class="room-head">
              <span class="room-icon" aria-hidden="true">🛏️</span>
              <span class="room-name">안방 · 아이방</span>
              <span class="room-badge" data-count="bedroom">3</span>
            </span>
            <span class="room-sub" data-sub="bedroom">0 / 3 완료</span>
            <span class="room-bar" aria-hidden="true"><span data-bar="bedroom"></span></span>
            <span class="room-preview" data-preview="bedroom"></span>
          </button>
          <span class="slot slot--su" data-slot="bedroom-su"></span>
          <span class="slot slot--jh" data-slot="bedroom-jh"></span>
        </article>

        <article class="room room--entry" data-room="entry">
          <button class="room-btn" type="button" aria-haspopup="dialog" aria-label="현관과 다용도실 집안일 보기">
            <span class="room-head">
              <span class="room-icon" aria-hidden="true">🚪</span>
              <span class="room-name">현관 · 다용도실</span>
              <span class="room-badge" data-count="entry">3</span>
            </span>
            <span class="room-sub" data-sub="entry">0 / 3 완료</span>
            <span class="room-bar" aria-hidden="true"><span data-bar="entry"></span></span>
            <span class="room-preview" data-preview="entry"></span>
          </button>
          <span class="slot slot--su" data-slot="entry-su"></span>
          <span class="slot slot--jh" data-slot="entry-jh"></span>
        </article>
      </div>

      <p class="house-hint">
        <span aria-hidden="true">👆</span> 방을 누르면 그 방의 집안일이 열려요. 피클 둘이 응원하러 다닙니다.
      </p>
    </section>

    <section class="list-card" aria-labelledby="listTitle">
      <header class="list-head">
        <div>
          <p class="list-kicker">CHECKLIST</p>
          <h2 class="list-title" id="listTitle">오늘의 집안일</h2>
        </div>
        <span class="list-count" id="listCount">0</span>
      </header>

      <div class="list-scroll" id="allList"></div>

      <form class="add-form" id="addForm" autocomplete="off">
        <label class="sr-only" for="addInput">새 집안일</label>
        <input class="add-input" id="addInput" type="text" maxlength="60" placeholder="예) 베란다 화분 물 주기">
        <div class="add-row">
          <label class="sr-only" for="addRoom">방</label>
          <select class="add-select" id="addRoom">
            <option value="living">거실</option>
            <option value="kitchen">주방</option>
            <option value="bath">욕실</option>
            <option value="bedroom">안방 · 아이방</option>
            <option value="entry">현관 · 다용도실</option>
          </select>
          <label class="sr-only" for="addWho">담당</label>
          <select class="add-select" id="addWho">
            <option value="jh">종화</option>
            <option value="su">수뚜</option>
            <option value="both">같이</option>
          </select>
          <label class="sr-only" for="addFreq">주기</label>
          <select class="add-select" id="addFreq">
            <option value="daily">매일</option>
            <option value="weekly">주간</option>
            <option value="any">수시</option>
          </select>
          <button class="add-btn" type="submit">추가</button>
        </div>
      </form>
    </section>
  </div>
</main>

<footer class="foot">
  <p>종화 · 수뚜의 집 · 피클 하우스</p>
  <p class="foot-sub">체크는 이 브라우저에만 저장되고, 날이 바뀌면 새로 시작해요.</p>
</footer>

<div class="scrim" id="scrim" hidden></div>

<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="sheet-grip" aria-hidden="true"></div>
  <header class="sheet-head">
    <div>
      <p class="sheet-kicker" id="sheetKicker">방</p>
      <h2 class="sheet-title" id="sheetTitle">방 이름</h2>
    </div>
    <button class="sheet-close" id="sheetClose" type="button" aria-label="상세 닫기">✕</button>
  </header>
  <div class="sheet-body" id="sheetBody"></div>
</aside>

<p class="sr-only" id="live" aria-live="polite"></p>

<script src="assets/app.js"></script>
</body>
</html>
